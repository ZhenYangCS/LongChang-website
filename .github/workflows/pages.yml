name: Deploy project page

on:
  push:
    branches: [main, master]
    paths:
      - project_page/**
      - index.html
      - assets/**
      - data/**
      - downloads/**
      - scripts/build_pages.sh
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package static files
        shell: bash
        run: |
          if [[ -f project_page/index.html ]]; then
            bash project_page/scripts/build_pages.sh "$RUNNER_TEMP/longchang-pages"
          else
            bash scripts/build_pages.sh "$RUNNER_TEMP/longchang-pages"
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/longchang-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
